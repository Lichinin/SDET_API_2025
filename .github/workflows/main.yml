name: Run Tests

on:
  push:
    branches:
      - api_tests
  pull_request:
    branches:
      - api_tests

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -q -d test -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Install Docker Compose
      run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

    - name: Pull Docker image
      run: docker pull lichinin/simbirsoft_api:latest

    - name: Start services
      working-directory: ./server
      run: |
        docker-compose up -d
        docker-compose run migrate \
          -path /migrations \
          -database "postgres://test:test@postgres:5432/test?sslmode=disable" \
          up 3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest