name: Run Tests

on:
  push:
    branches:
      - api_tests
  pull_request:
    branches:
      - api_tests

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout server code
      uses: actions/checkout@v4
      with:
        repository: Lichinin/simbirsoft_sdet_project_api_server
        path: server 

    - name: Start server with Docker Compose
      run: |
        cd server  # Переходим в папку с сервером
        docker-compose up -d
        sleep 10  # Ждём запуска (лучше заменить на healthcheck)

    - name: Wait for server
      run: |
        until curl -s http://localhost:8080/health; do
          sleep 1
        done

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest