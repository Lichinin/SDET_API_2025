version: '3.9'

services:
  service:
    image: lichinin/simbirsoft_api:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      HTTP_PORT: 8080
      LOGGER_FORMAT: json
    ports:
      - "8080:8080"

  migrate:
    image: migrate/migrate
    network_mode: host
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://test:test@postgres:5432/test?sslmode=disable"
      - "up"
      - "3"